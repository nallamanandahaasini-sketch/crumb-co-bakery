{% extends "base.html" %}{% block content %}<div class="container section-pad"><h1>Ingredient <i>inventory.</i></h1><form method="post" class="panel row g-2 my-4"><div class="col-md-3"><input class="form-control" name="name" placeholder="Ingredient" required></div><div class="col-md-2"><input class="form-control" name="quantity" type="number" step=".1" placeholder="Quantity" required></div><div class="col-md-2"><input class="form-control" name="unit" placeholder="Unit" value="kg"></div><div class="col-md-2"><input class="form-control" name="reorder_level" type="number" step=".1" value="5" placeholder="Reorder level"></div><div class="col-md-2"><select class="form-select" name="supplier_id"><option value="">Supplier</option>{% for s in suppliers %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></div><div class="col-md-1"><button class="btn btn-choco">Add</button></div></form><table class="table"><tr><th>Ingredient</th><th>Available</th><th>Reorder level</th><th>Supplier</th></tr>{% for i in items %}<tr><td>{{i.name}}</td><td>{{i.quantity}} {{i.unit}}</td><td>{{i.reorder_level}}</td><td>{{i.supplier.name if i.supplier else '-'}}</td></tr>{% endfor %}</table></div>{% endblock %}
