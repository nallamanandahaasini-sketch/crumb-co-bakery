{% extends "base.html" %}{% block content %}<div class="container section-pad"><span class="eyebrow">YOUR ORDERS</span><h1>Order <i>history.</i></h1><div class="table-responsive mt-4"><table class="table"><tr><th>Order</th><th>Date</th><th>Status</th><th>Total</th></tr>{% for o in orders %}<tr><td>#{{o.id}}</td><td>{{o.created_at.strftime('%d %b %Y')}}</td><td><span class="status">{{o.status}}</span></td><td>₹{{'%.2f'|format(o.total)}}</td></tr>{% else %}<tr><td colspan="4">No orders yet.</td></tr>{% endfor %}</table></div></div>{% endblock %}
