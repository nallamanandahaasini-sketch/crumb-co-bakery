{% extends "base.html" %}{% block content %}<div class="container section-pad"><h1>Our <i>suppliers.</i></h1><form method="post" class="panel row g-2 my-4"><div class="col-md-4"><input class="form-control" name="name" placeholder="Supplier name" required></div><div class="col-md-3"><input class="form-control" name="phone" placeholder="Phone"></div><div class="col-md-3"><input class="form-control" name="address" placeholder="Address"></div><div class="col-md-2"><button class="btn btn-choco w-100">Add supplier</button></div></form>{% for s in suppliers %}<div class="panel mb-2"><b>{{s.name}}</b><div class="muted">{{s.phone}} · {{s.address}}</div></div>{% endfor %}</div>{% endblock %}
