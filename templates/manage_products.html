{% extends "base.html" %}{% block content %}<div class="container section-pad"><h1>Product <i>management.</i></h1><form method="post" class="row g-2 panel my-4"><div class="col-md-3"><input class="form-control" name="name" placeholder="Product name" required></div><div class="col-md-2"><input class="form-control" name="price" type="number" min="0" step=".01" placeholder="Price" required></div><div class="col-md-2"><select class="form-select" name="category_id"><option value="">Category</option>{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></div><div class="col-md-3"><input class="form-control" name="image" placeholder="Image URL"></div><div class="col-md-2"><button class="btn btn-choco w-100">Add product</button></div><div class="col-12"><input class="form-control" name="description" placeholder="Short description"></div></form><div class="table-responsive"><table class="table"><tr><th>Product</th><th>Category</th><th>Price</th><th>Availability</th><th></th></tr>{% for p in products %}<tr><td>{{p.name}}</td><td>{{p.category.name if p.category else '-'}}</td><td>₹{{p.price}}</td><td>{{'Available' if p.is_available else 'Hidden'}}</td><td>{% if p.is_available %}<form method="post" action="{{url_for('admin.delete_product',pid=p.id)}}"><button class="btn btn-sm btn-outline-secondary">Hide</button></form>{% endif %}</td></tr>{% endfor %}</table></div></div>{% endblock %}
